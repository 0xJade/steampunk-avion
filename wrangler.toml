# Cloudflare Pages configuration for Steampunk Express.
# Committing this means the compatibility flags travel with the repo — you don't
# have to set them by hand in the dashboard.

# Must match your Cloudflare Pages project name exactly (wrangler deploys here).
name = "steampunk-avion"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# REQUIRED: node-ical (the .ics parser) imports Node built-ins like `fs`.
# Without this flag the availability Worker throws at runtime.
compatibility_flags = ["nodejs_compat"]

# ── Non-secret config (safe to commit). ──────────────────────────────────────
# Secrets (STAYING_API_KEY, or ICS_URL if you use the .ics provider) do NOT go
# here — set them as encrypted env vars in the dashboard, or with:
#   npx wrangler pages secret put STAYING_API_KEY
[vars]
# Using the StayingAPI REST provider. Set STAYING_API_KEY (a stay_live_ key) as
# an encrypted secret. Without a key this falls back to mock data, not a crash.
AVAILABILITY_PROVIDER = "staying"
STAYING_PLATFORM = "airbnb"
AVAILABILITY_CACHE_SECONDS = "1200"

# ── Optional: sessions KV binding. ───────────────────────────────────────────
# The Astro Cloudflare adapter references a "SESSION" KV binding. This site does
# NOT use sessions, so you can ignore it. Only if you ever see
# "Invalid binding `SESSION`" at runtime, create a namespace and uncomment:
#
#   npx wrangler kv namespace create SESSION
#
# [[kv_namespaces]]
# binding = "SESSION"
# id = "PASTE_NAMESPACE_ID_HERE"
